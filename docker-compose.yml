# WanderSync Travel Solutions: `docker compose up --build`
# Requiere un .env con DATABASE_URL (Supabase Postgres) y JWT_SECRET (ver .env.example).
# Presupuesto de memoria total ~4.3 GB (mem_limit por contenedor).

x-python-service: &python-service
  env_file: .env
  restart: unless-stopped
  environment: &common-env
    ALLOW_FAILURE_SIMULATION: "true"

x-py-health: &py-health
  test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 10s

services:
  # ------------------------------------------------------------ base de datos: migraciones (one-shot)
  migrate:
    build: { context: ., dockerfile: db/Dockerfile }
    env_file: .env
    mem_limit: 128m
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    mem_limit: 64m
    restart: unless-stopped
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  # ------------------------------------------------------------ microservicios de dominio
  flights:
    <<: *python-service
    build: { context: ., dockerfile: services/flights/Dockerfile }
    mem_limit: 128m
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: *py-health

  hotels:
    <<: *python-service
    build: { context: ., dockerfile: services/hotels/Dockerfile }
    mem_limit: 128m
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: *py-health

  cars:
    <<: *python-service
    build: { context: ., dockerfile: services/cars/Dockerfile }
    mem_limit: 128m
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: *py-health

  orders:
    <<: *python-service
    build: { context: ., dockerfile: services/orders/Dockerfile }
    mem_limit: 192m
    environment:
      <<: *common-env
      FLIGHTS_URL: http://flights:8000
      HOTELS_URL: http://hotels:8000
      CARS_URL: http://cars:8000
      SAGA_STEP_DELAY_MS: "700"   # pausa visible entre pasos para la demo (0 para desactivar)
    depends_on:
      flights: { condition: service_healthy }
      hotels: { condition: service_healthy }
      cars: { condition: service_healthy }
    healthcheck: *py-health

  # ------------------------------------------------------------ API Gateway GraphQL (sin puerto publicado: solo vía nginx)
  gateway:
    <<: *python-service
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    mem_limit: 256m
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379/0
      ORDERS_URL: http://orders:8000
      TRUST_PROXY_HEADERS: "true"       # solo nginx alcanza este contenedor
      COOKIE_SECURE: "false"            # true detrás de HTTPS
      GRAPHQL_INTROSPECTION: "true"     # false en producción
      ENABLE_DEBUG_ENDPOINTS: "true"
      ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    depends_on:
      redis: { condition: service_healthy }
      orders: { condition: service_healthy }
    healthcheck: *py-health

  frontend:
    build: { context: ./frontend }
    mem_limit: 32m
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on:
      gateway: { condition: service_healthy }

  # ------------------------------------------------------------ orquestación (Prefect) + cómputo distribuido (Dask)
  prefect-server:
    build: { context: ., dockerfile: ingestion/Dockerfile }
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_UI_STATIC_DIRECTORY: /data/prefect/ui   # escribible: el usuario no-root no puede escribir en site-packages
    ports: ["4200:4200"]
    volumes: ["prefect-data:/data"]
    mem_limit: 640m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4200/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  dask-scheduler:
    build: { context: ., dockerfile: ingestion/Dockerfile }
    command: ["dask", "scheduler", "--host", "0.0.0.0", "--port", "8786", "--dashboard-address", ":8787"]
    ports: ["8787:8787"]
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8786), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20

  dask-worker:
    build: { context: ., dockerfile: ingestion/Dockerfile }
    command: ["dask", "worker", "tcp://dask-scheduler:8786", "--nthreads", "2", "--nworkers", "1", "--memory-limit", "520MB", "--no-dashboard"]
    env_file: .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      SCRAPER_MODE: ${SCRAPER_MODE:-auto}
      SCRAPE_FLIGHT_DAYS: ${SCRAPE_FLIGHT_DAYS:-3,7}   # días (desde hoy) de vuelos reales por ruta
    deploy: { replicas: 2 }
    mem_limit: 1g                 # incluye un Chromium headless (Scrapling) por worker
    shm_size: 256m
    restart: unless-stopped
    depends_on:
      dask-scheduler: { condition: service_healthy }
      prefect-server: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  prefect-runner:
    build: { context: ., dockerfile: ingestion/Dockerfile }
    command: ["python", "-m", "ingestion.serve"]
    env_file: .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      DASK_SCHEDULER: tcp://dask-scheduler:8786
      SCRAPER_MODE: ${SCRAPER_MODE:-auto}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-1800}   # la sync real tarda ~12 min
    volumes: ["prefect-data:/data"]
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      prefect-server: { condition: service_healthy }
      dask-scheduler: { condition: service_healthy }
      dask-worker: { condition: service_started }
      migrate: { condition: service_completed_successfully }

volumes:
  prefect-data:
